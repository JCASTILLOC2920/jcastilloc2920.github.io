    <!-- Visor 360° Interactivo Integrado en la Misma Página -->
    <script>
    (function initInline360Viewer() {
        const totalFrames = 36;
        const framePath = (idx) => `microscopio_360/frame_${String(idx).padStart(2, '0')}.webp`;
        
        // Precarga de todos los 36 fotogramas en segundo plano
        const cachedFrames = [];
        for (let i = 0; i < totalFrames; i++) {
            const img = new Image();
            img.src = framePath(i);
            cachedFrames.push(img);
        }

        const viewerImg = document.getElementById('microscope360Img');
        const container = document.getElementById('microscope360Container');
        const angleBadge = document.getElementById('microscope360Angle');
        const pillBtn = document.getElementById('microscope360Pill');
        const pillIcon = document.getElementById('microscope360Icon');
        const pillText = document.getElementById('microscope360PillText');

        if (!viewerImg || !container) return;

        let currentFrame = 0;
        let isDragging = false;
        let startX = 0;
        let startFrame = 0;
        let autoRotate = true;
        let autoRotateInterval = null;
        let resumeTimer = null;

        function setFrame(idx) {
            currentFrame = ((idx % totalFrames) + totalFrames) % totalFrames;
            viewerImg.src = framePath(currentFrame);
            const deg = Math.round((currentFrame / totalFrames) * 360);
            if (angleBadge) {
                angleBadge.textContent = `${deg}°`;
            }
        }

        function startAutoRotate() {
            if (autoRotateInterval) return;
            autoRotate = true;
            if (pillIcon) pillIcon.classList.add('animate-spin');
            if (pillText) pillText.textContent = 'Pausar';
            autoRotateInterval = setInterval(() => {
                setFrame(currentFrame + 1);
            }, 100);
        }

        function stopAutoRotate() {
            autoRotate = false;
            if (autoRotateInterval) {
                clearInterval(autoRotateInterval);
                autoRotateInterval = null;
            }
            if (pillIcon) pillIcon.classList.remove('animate-spin');
            if (pillText) pillText.textContent = 'Girar 360°';
            if (resumeTimer) clearTimeout(resumeTimer);
        }

        function scheduleAutoResume() {
            if (resumeTimer) clearTimeout(resumeTimer);
            resumeTimer = setTimeout(() => {
                startAutoRotate();
            }, 3500);
        }

        // Eventos táctiles y mouse unificados (Pointer Events)
        container.addEventListener('pointerdown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startFrame = currentFrame;
            try { container.setPointerCapture(e.pointerId); } catch(err) {}
            container.classList.remove('cursor-grab');
            container.classList.add('cursor-grabbing');
            stopAutoRotate();
        });

        container.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - startX;
            // Sensibilidad: cada 9 píxeles de arrastre avanza 1 fotograma
            const frameOffset = Math.floor(-deltaX / 9);
            setFrame(startFrame + frameOffset);
        });

        function endPointerDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            container.classList.remove('cursor-grabbing');
            container.classList.add('cursor-grab');
            try { container.releasePointerCapture(e.pointerId); } catch(err) {}
            scheduleAutoResume();
        }

        container.addEventListener('pointerup', endPointerDrag);
        container.addEventListener('pointercancel', endPointerDrag);

        // Control del botón de la píldora
        if (pillBtn) {
            pillBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (autoRotate) {
                    stopAutoRotate();
                } else {
                    startAutoRotate();
                }
            });
        }

        // Iniciar auto-rotación suave después de 1 segundo
        setTimeout(startAutoRotate, 1000);
    })();

    // Lógica de Redirección Interactiva para Consulta Rápida
    function handleQuickSearchRedirect() {
        const input = document.getElementById('inputQuickSearchCod');
        if (!input) return;
        const val = input.value.trim();
        if (!val) {

            input.classList.add('border-red-500');

        // Redirige al portal de reportes o visor móvil con el parámetro cod
        const targetUrl = `https://jcastilloc2920.github.io/ARCHIVO-DE-REPORTES/imprimir.html?cod=${encodeURIComponent(val)}`;
        window.open(targetUrl, '_blank');
    }

    // Permitir enviar con Enter
    document.addEventListener('DOMContentLoaded', () => {
        const inp = document.getElementById('inputQuickSearchCod');
        if (inp) {
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleQuickSearchRedirect();
                }
            });
        }
    });
    </script>
