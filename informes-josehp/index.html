<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Pacientes - JC PATH LAB</title>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para los Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Navbar Superior -->
    <header class="navbar">
        <div class="navbar-left">
            <button class="sidebar-toggle" id="toggleSidebar">
                <i class="fa-solid fa-bars"></i>
            </button>
            <div class="logo-area">
                <i class="fa-solid fa-microscope clinic-icon"></i>
                <span class="brand-name">JC PATH LAB</span>
            </div>
            <span class="welcome-text">Bienvenido: <strong>JOSEHP CHRISTOPHER, CASTILLO CUENCA</strong></span>
        </div>
        <div class="navbar-right">
            <button class="nav-icon-btn" title="Configuración">
                <i class="fa-solid fa-user-gear"></i>
            </button>
        </div>
    </header>

    <div class="main-layout">
        <!-- Sidebar Izquierda -->
        <aside class="sidebar" id="sidebarMenu">
            <ul class="sidebar-menu">
                <li class="active"><a href="#"><i class="fa-solid fa-hospital-user"></i> <span>Pacientes</span></a></li>
                <li><a href="#" onclick="abrirModal('crear')"><i class="fa-solid fa-user-plus"></i> <span>Ingreso de pacientes</span></a></li>
                <li><a href="#"><i class="fa-solid fa-file-invoice-dollar"></i> <span>Facturación</span></a></li>
                <li><a href="#"><i class="fa-solid fa-receipt"></i> <span>Boletas</span></a></li>
                <li><a href="#"><i class="fa-solid fa-chart-line"></i> <span>Rendimiento</span></a></li>
                <li><a href="#"><i class="fa-solid fa-circle-info"></i> <span>Soporte</span></a></li>
            </ul>
        </aside>

        <!-- Contenedor de Contenido Principal -->
        <main class="content-wrapper">
            <!-- Panel de Búsqueda y Filtros -->
            <section class="filter-card">
                <form id="searchForm" class="filter-grid">
                    <div class="input-group">
                        <label for="fecInicio">Fec. Inicio</label>
                        <input type="date" id="fecInicio" name="fecInicio">
                    </div>
                    <div class="input-group">
                        <label for="fecFinal">Fec. Final</label>
                        <input type="date" id="fecFinal" name="fecFinal">
                    </div>
                    <div class="input-group">
                        <label for="codAtencion">Cod. Atención</label>
                        <input type="text" id="codAtencion" placeholder="Ej: 26Q-188">
                    </div>
                    <div class="input-group">
                        <label for="nomPaciente">Nom. Paciente</label>
                        <input type="text" id="nomPaciente" placeholder="Nombres">
                    </div>
                    <div class="input-group">
                        <label for="apePaciente">Ape. Paciente</label>
                        <input type="text" id="apePaciente" placeholder="Apellidos">
                    </div>
                    <div class="input-group">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" placeholder="Digite DNI">
                    </div>
                    <div class="input-group md-solicitante-group">
                        <label for="medSolicitante">Med. Solicitante</label>
                        <input type="text" id="medSolicitante" placeholder="Ing. nombre doctor o referencia">
                    </div>
                    <div class="button-group">
                        <button type="submit" class="btn btn-search">
                            <i class="fa-solid fa-magnifying-glass"></i> Buscar
                        </button>
                        <button type="button" class="btn btn-patient" id="addPatientBtn">
                            <i class="fa-solid fa-user-plus"></i> Paciente
                        </button>
                    </div>
                </form>
            </section>

            <!-- Categorías / Pestañas de Servicios -->
            <nav class="services-tabs">
                <button class="tab-link active" data-tab="HE">Serv. muestra HE (Q)</button>
                <button class="tab-link" data-tab="IHC">Serv. Inmunohistoquímica (I)</button>
                <button class="tab-link" data-tab="CITO">Serv. Citología (C)</button>
            </nav>

            <!-- Tabla de Registros -->
            <div class="table-container">
                <table class="patient-table">
                    <thead>
                        <tr>
                            <th width="40">#</th>
                            <th>COD-ATENCIÓN</th>
                            <th>DNI</th>
                            <th>MED. SOLICITANTE</th>
                            <th>PACIENTE</th>
                            <th>COSTO SERVICIO</th>
                            <th>ADELANTO</th>
                            <th>RESTA</th>
                            <th>FEC. ENTREGA</th>
                            <th width="50" class="text-center">E</th>
                            <th width="50" class="text-center">VER</th>
                            <th width="50" class="text-center">ACCIONES</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- Las filas se inyectan dinámicamente mediante JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Modal para Agregar/Editar Paciente -->
    <div class="modal-overlay" id="patientModal">
        <div class="modal-card advanced-modal">
            <div class="modal-header">
                <h3 id="modalTitle">Registro Paciente</h3>
                <button class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <form id="modalForm" class="modal-form">
                <div class="modal-body-scroll">
                    <!-- Fila 1: Tipo Servicio -->
                    <div class="form-row">
                        <label for="mTipoServicio">Tipo Servicio</label>
                        <select id="mTipoServicio" class="full-width">
                            <option value="">SELECCIONAR</option>
                            <option value="HE">HE (Q)</option>
                            <option value="IHC">Inmunohistoquímica (I)</option>
                            <option value="CITO">Citología (C)</option>
                        </select>
                    </div>
                    <!-- Fila 2: Cod Atencion -->
                    <div class="form-row">
                        <label for="mCodAtencion">Cod. Atención</label>
                        <div class="input-with-btn">
                            <input type="text" id="mCodAtencion" placeholder="Forma consulta: Q,I,C-#" required>
                            <button type="button" class="btn btn-primary btn-sm">Validar</button>
                        </div>
                    </div>
                    <!-- Fila 3: DNI -->
                    <div class="form-row">
                        <label for="mDni">DNI</label>
                        <div class="input-with-btn">
                            <input type="text" id="mDni" placeholder="DNI" required>
                            <button type="button" class="btn btn-primary btn-sm">Buscar</button>
                        </div>
                    </div>
                    <!-- Fila 4: Nombres -->
                    <div class="form-row">
                        <label for="mNombres">Nombres</label>
                        <input type="text" id="mNombres" placeholder="Nombre completos" class="full-width" required>
                    </div>
                    <!-- Fila 5: Apellidos -->
                    <div class="form-row">
                        <label for="mApellidos">Apellidos</label>
                        <input type="text" id="mApellidos" placeholder="Apellidos Completos" class="full-width" required>
                    </div>
                    <!-- Fila 6: Edad -->
                    <div class="form-row">
                        <label for="mEdad">Edad</label>
                        <input type="text" id="mEdad" placeholder="Edad" class="full-width">
                    </div>
                    <!-- Fila 7: Telefono -->
                    <div class="form-row">
                        <label for="mTelefono">Telefono</label>
                        <input type="text" id="mTelefono" placeholder="Telefono" class="full-width">
                    </div>
                    <!-- Fila 8: Sexo -->
                    <div class="form-row">
                        <label for="mSexo">Sexo</label>
                        <select id="mSexo" class="full-width">
                            <option value="">SELECCIONAR</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                        </select>
                    </div>
                    <!-- Fila 9: F. Contacto -->
                    <div class="form-row">
                        <label for="mFContacto">F. Contacto</label>
                        <input type="text" id="mFContacto" placeholder="Contacto" class="full-width">
                    </div>
                    <!-- Fila 10: Tel. Contacto -->
                    <div class="form-row">
                        <label for="mTelContacto">Tel. Contacto</label>
                        <input type="text" id="mTelContacto" placeholder="Telefono" class="full-width">
                    </div>
                    <!-- Fila 11: Med Solicitante -->
                    <div class="form-row">
                        <label for="mMedSolicitante">Med. Solicitante</label>
                        <div class="input-with-btn">
                            <select id="mMedSolicitante" class="full-width" required>
                                <option value="">SELECCIONAR</option>
                                <option value="Dr. Ejemplo 1">Dr. Ejemplo 1</option>
                                <option value="Dra. Ejemplo 2">Dra. Ejemplo 2</option>
                            </select>
                            <button type="button" class="btn btn-secondary btn-sm">Copiar</button>
                            <button type="button" class="btn btn-primary btn-sm">Registro</button>
                        </div>
                    </div>
                    <!-- Fila 12: Motivo Estudio -->
                    <div class="form-row align-top">
                        <label for="mMotivoEstudio">Motivo Estudio</label>
                        <textarea id="mMotivoEstudio" rows="4" class="full-width"></textarea>
                    </div>
                    <!-- Fila 13: Costo Transp. -->
                    <div class="form-row">
                        <label for="mCosto">Costo Transp.</label>
                        <div class="input-stacked">
                            <input type="number" id="mCosto" value="0" class="full-width">
                            <label class="checkbox-inline"><input type="checkbox" id="mPagoPendiente"> <strong>Pago Pendiente</strong></label>
                        </div>
                    </div>
                    <!-- Fila 14: Adelanto -->
                    <div class="form-row">
                        <label for="mAdelanto">Adelanto</label>
                        <input type="number" id="mAdelanto" value="0" class="full-width">
                    </div>
                    <!-- Fila 15: Clinica -->
                    <div class="form-row">
                        <label for="mClinica">Clinica</label>
                        <input type="text" id="mClinica" placeholder="Ingreso de la clinica" class="full-width">
                    </div>
                    <!-- Fila 16: Orden Servicio -->
                    <div class="form-row">
                        <label for="mOrdenServicio">Orden Servicio</label>
                        <input type="file" id="mOrdenServicio" class="full-width">
                    </div>
                    <!-- Fila 17: Fec. Probable -->
                    <div class="form-row pb-3 border-bottom">
                        <label for="mFechaEntrega"><strong>Fec. Probable-Entrega</strong></label>
                        <input type="date" id="mFechaEntrega" class="full-width bg-gray" required>
                    </div>
                </div>
                <div class="modal-footer split-footer">
                    <button type="button" class="btn btn-cancel" id="cancelModalBtn">Salir</button>
                    <button type="submit" class="btn btn-primary" id="saveModalBtn">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- Script de Datos y Control -->
    <script src="script.js"></script>
</body>
</html>
